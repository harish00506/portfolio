<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1414" width="1000" height="1414"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0b4f45"/></marker><marker id="tipGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#4d6660"/></marker></defs><rect width="1000" height="1414" fill="#ffffff"/><text x="0" y="34" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#4d6660" text-anchor="start">HOW A SESSION STARTS</text><rect x="0" y="122" width="212" height="52" rx="9" fill="#eef3f1" stroke="#b9ccc7" stroke-width="1.4"/><text x="106" y="155" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" fill="#15201d" text-anchor="middle">Open the app</text><rect x="262" y="122" width="212" height="52" rx="9" fill="#ffffff" stroke="#b9ccc7" stroke-width="1.4"/><text x="368" y="155" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" fill="#15201d" text-anchor="middle">App lock</text><rect x="524" y="122" width="212" height="52" rx="9" fill="#ffffff" stroke="#b9ccc7" stroke-width="1.4"/><text x="630" y="155" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" fill="#15201d" text-anchor="middle">Onboarding</text><rect x="786" y="122" width="212" height="52" rx="9" fill="#e4efec" stroke="#b9ccc7" stroke-width="1.4"/><text x="892" y="155" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" fill="#15201d" text-anchor="middle">Dashboard</text><line x1="217" y1="148" x2="255" y2="148" stroke="#0b4f45" stroke-width="1.8" marker-end="url(#tip)"/><line x1="479" y1="148" x2="517" y2="148" stroke="#0b4f45" stroke-width="1.8" marker-end="url(#tip)"/><line x1="741" y1="148" x2="779" y2="148" stroke="#0b4f45" stroke-width="1.8" marker-end="url(#tip)"/><path d="M 368 120 C 408 56, 852 56, 892 118" fill="none" stroke="#0b4f45" stroke-width="1.8" marker-end="url(#tip)"/><text x="630" y="68" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#0b4f45" text-anchor="middle">every launch after the first</text><path d="M 892 176 C 852 228, 670 228, 630 178" fill="none" stroke="#4d6660" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#tipGrey)"/><text x="761" y="254" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#4d6660" text-anchor="middle">Exit demo, on the sample-data banner</text><text x="0" y="290" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#4d6660" text-anchor="start">· The lock appears only if a PIN is set. It is drawn over whatever is behind it, so unlocking lands you there — not on a screen of its own.</text><text x="0" y="312" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#4d6660" text-anchor="start">· Onboarding is the first screen on a fresh install only. Finish it, or take the sample data, and the app opens on the dashboard from then on.</text><text x="0" y="334" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#4d6660" text-anchor="start">· The widget and every notification open the app, not a screen: they all land on the dashboard.</text><text x="0" y="390" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#4d6660" text-anchor="start">THE HUB — 12 DESTINATIONS, ONE TAP EACH</text><rect x="0" y="412" width="1000" height="48" rx="9" fill="#e4efec" stroke="#b9ccc7" stroke-width="1.4"/><text x="16" y="443" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#0b4f45" text-anchor="start">Dashboard</text><text x="984" y="443" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#4d6660" text-anchor="end">the screen the app opens on — everything below is one tap from here</text><rect x="0" y="480" width="480" height="56" rx="9" fill="#ffffff" stroke="#b9ccc7" stroke-width="1.4"/><text x="14" y="506" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#15201d" text-anchor="start">Order of operations</text><text x="14" y="525" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#4d6660" text-anchor="start">See the full order</text><rect x="520" y="480" width="480" height="56" rx="9" fill="#ffffff" stroke="#b9ccc7" stroke-width="1.4"/><text x="534" y="506" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#15201d" text-anchor="start">Budgets</text><text x="534" y="525" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#4d6660" text-anchor="start">Your budgets</text><rect x="0" y="550" width="480" height="144" rx="9" fill="#ffffff" stroke="#b9ccc7" stroke-width="1.4"/><text x="14" y="576" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#15201d" text-anchor="start">Accounts</text><text x="14" y="595" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#4d6660" text-anchor="start">Your accounts</text><text x="28" y="618" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#0b4f45" text-anchor="start">↳ Account editor</text><text x="466" y="618" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#4d6660" text-anchor="end">Add account</text><text x="28" y="640" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#0b4f45" text-anchor="start">↳ Account editor</text><text x="466" y="640" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#4d6660" text-anchor="end">Edit account, on a row</text><text x="28" y="662" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#0b4f45" text-anchor="start">↳ Holdings</text><text x="466" y="662" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#4d6660" text-anchor="end">Holdings, on an investment row</text><text x="28" y="684" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#0b4f45" text-anchor="start">↳ Allocation</text><text x="466" y="684" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#4d6660" text-anchor="end">See allocation</text><rect x="520" y="550" width="480" height="144" rx="9" fill="#ffffff" stroke="#b9ccc7" stroke-width="1.4"/><text x="534" y="576" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#15201d" text-anchor="start">Transactions</text><text x="534" y="595" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#4d6660" text-anchor="start">View transactions</text><text x="548" y="618" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#0b4f45" text-anchor="start">↳ Categories</text><text x="986" y="618" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#4d6660" text-anchor="end">Categories</text><rect x="0" y="708" width="480" height="78" rx="9" fill="#ffffff" stroke="#b9ccc7" stroke-width="1.4"/><text x="14" y="734" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#15201d" text-anchor="start">Goals</text><text x="14" y="753" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#4d6660" text-anchor="start">Your goals</text><text x="28" y="776" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#0b4f45" text-anchor="start">↳ Goal detail</text><text x="466" y="776" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#4d6660" text-anchor="end">What is behind this figure, on a goal</text><rect x="520" y="708" width="480" height="78" rx="9" fill="#ffffff" stroke="#b9ccc7" stroke-width="1.4"/><text x="534" y="734" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#15201d" text-anchor="start">Emergency fund</text><text x="534" y="753" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#4d6660" text-anchor="start">Emergency fund</text><rect x="0" y="800" width="480" height="56" rx="9" fill="#ffffff" stroke="#b9ccc7" stroke-width="1.4"/><text x="14" y="826" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#15201d" text-anchor="start">Purchase advisor</text><text x="14" y="845" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#4d6660" text-anchor="start">Can I afford this?</text><rect x="520" y="800" width="480" height="56" rx="9" fill="#ffffff" stroke="#b9ccc7" stroke-width="1.4"/><text x="534" y="826" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#15201d" text-anchor="start">Simulators</text><text x="534" y="845" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#4d6660" text-anchor="start">What if?</text><rect x="0" y="870" width="480" height="56" rx="9" fill="#ffffff" stroke="#b9ccc7" stroke-width="1.4"/><text x="14" y="896" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#15201d" text-anchor="start">Vehicles</text><text x="14" y="915" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#4d6660" text-anchor="start">Your vehicles</text><rect x="520" y="870" width="480" height="56" rx="9" fill="#ffffff" stroke="#b9ccc7" stroke-width="1.4"/><text x="534" y="896" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#15201d" text-anchor="start">Assistant</text><text x="534" y="915" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#4d6660" text-anchor="start">Ask your CFO</text><rect x="0" y="940" width="480" height="100" rx="9" fill="#ffffff" stroke="#b9ccc7" stroke-width="1.4"/><text x="14" y="966" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#15201d" text-anchor="start">Opportunity</text><text x="14" y="985" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#4d6660" text-anchor="start">Good day to invest?</text><rect x="520" y="940" width="480" height="100" rx="9" fill="#ffffff" stroke="#b9ccc7" stroke-width="1.4"/><text x="534" y="966" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#15201d" text-anchor="start">Settings</text><text x="534" y="985" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#4d6660" text-anchor="start">Settings</text><text x="548" y="1008" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#0b4f45" text-anchor="start">↳ Consents</text><text x="986" y="1008" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#4d6660" text-anchor="end">Manage what the app may use</text><text x="548" y="1030" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#0b4f45" text-anchor="start">↳ Erase everything</text><text x="986" y="1030" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#4d6660" text-anchor="end">Erase everything</text><text x="0" y="1080" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#4d6660" text-anchor="start">THE + BUTTON — FROM EVERY SCREEN</text><rect x="0" y="1102" width="1000" height="88" rx="9" fill="#eef3f1" stroke="#b9ccc7" stroke-width="1.4" stroke-dasharray="7 5"/><text x="18" y="1140" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#15201d" text-anchor="start">The + button</text><text x="18" y="1160" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#4d6660" text-anchor="start">floats over every screen except onboarding</text><text x="18" y="1178" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#4d6660" text-anchor="start">and the capture form itself</text><rect x="330" y="1126" width="220" height="40" rx="9" fill="#ffffff" stroke="#b9ccc7" stroke-width="1.4"/><text x="344" y="1152" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#15201d" text-anchor="start">Add transaction</text><line x1="300" y1="1146" x2="322" y2="1146" stroke="#0b4f45" stroke-width="1.8" marker-end="url(#tip)"/><rect x="620" y="1118" width="380" height="26" rx="9" fill="#ffffff" stroke="#b9ccc7" stroke-width="1.4"/><text x="634" y="1136" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#15201d" text-anchor="start">Receipt review</text><text x="986" y="1136" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#4d6660" text-anchor="end">Scan a receipt</text><line x1="558" y1="1146" x2="612" y2="1131" stroke="#0b4f45" stroke-width="1.8" marker-end="url(#tip)"/><rect x="620" y="1150" width="380" height="26" rx="9" fill="#ffffff" stroke="#b9ccc7" stroke-width="1.4"/><text x="634" y="1168" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#15201d" text-anchor="start">Bank-alert drafts</text><text x="986" y="1168" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#4d6660" text-anchor="end">From your bank messages</text><line x1="558" y1="1146" x2="612" y2="1163" stroke="#0b4f45" stroke-width="1.8" marker-end="url(#tip)"/><text x="0" y="1230" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#4d6660" text-anchor="start">SIDEWAYS — A SCREEN THAT OPENS ANOTHER SCREEN OF THE SAME RANK</text><rect x="0" y="1252" width="1000" height="100" rx="9" fill="#ffffff" stroke="#b9ccc7" stroke-width="1.4" stroke-dasharray="7 5"/><text x="18" y="1282" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="bold" fill="#15201d" text-anchor="start">Order of operations</text><text x="300" y="1282" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#4d6660" text-anchor="start">⇢</text><text x="330" y="1282" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="bold" fill="#0b4f45" text-anchor="start">Goals</text><text x="520" y="1282" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#4d6660" text-anchor="start">Open your goals</text><text x="18" y="1310" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="bold" fill="#15201d" text-anchor="start">Order of operations</text><text x="300" y="1310" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#4d6660" text-anchor="start">⇢</text><text x="330" y="1310" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="bold" fill="#0b4f45" text-anchor="start">Emergency fund</text><text x="520" y="1310" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#4d6660" text-anchor="start">Open your emergency fund</text><text x="18" y="1338" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="bold" fill="#15201d" text-anchor="start">Order of operations</text><text x="300" y="1338" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#4d6660" text-anchor="start">⇢</text><text x="330" y="1338" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="bold" fill="#0b4f45" text-anchor="start">Accounts</text><text x="520" y="1338" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#4d6660" text-anchor="start">Add the card&#x27;s rate in Accounts</text><text x="0" y="1394" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#4d6660" text-anchor="start">25 screens. Every box is a place you can be; every arrow is something you tap. Drawn from the table that follows.</text></svg>