<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Apply the saved or system theme before first paint, so a dark-mode reload never flashes light.
         ThemeToggle.jsx writes the same localStorage key. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>

    <title>Harish G | Agentic AI &amp; Automation Engineer</title>
    <meta
      name="description"
      content="Harish G, Agentic AI &amp; Automation Engineer. Building scalable backend systems and AI-driven applications with Java, Python and JavaScript, LLMs, RAG and agent workflows."
    />
    <meta name="author" content="Harish G" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#fcfcfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0e11" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://www.harishg.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Harish G | Portfolio" />
    <meta property="og:title" content="Harish G | Agentic AI &amp; Automation Engineer" />
    <meta
      property="og:description"
      content="Agentic AI & Automation Engineer building LLM guardrails, tool-calling agents and RAG with FastAPI, Spring Boot and React."
    />
    <meta property="og:url" content="https://www.harishg.com/" />
    <meta property="og:image" content="https://www.harishg.com/og-image.png" />
    <!-- Declared dimensions let LinkedIn and others render the card on the first share instead of fetching the image first. -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Harish G, Agentic AI and Automation Engineer" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Harish G | Agentic AI &amp; Automation Engineer" />
    <meta
      name="twitter:description"
      content="Agentic AI & Automation Engineer building LLM guardrails, tool-calling agents and RAG with FastAPI, Spring Boot and React."
    />
    <meta name="twitter:image" content="https://www.harishg.com/og-image.png" />
    <meta name="twitter:image:alt" content="Harish G, Agentic AI and Automation Engineer" />

    <!-- Fonts: Schibsted Grotesk (display) · Atkinson Hyperlegible Next (body) · Martian Mono (technical).
         Self-hosted from /fonts (see src/index.css); these two carry the first paint, so they are
         fetched in parallel with the stylesheet instead of waiting for it to be parsed. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/schibsted-grotesk-normal-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/atkinson-hyperlegible-next-normal-latin.woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
